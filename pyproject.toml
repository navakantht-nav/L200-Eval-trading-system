[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "l200-eval-trading-system"
version = "0.2.0"
description = "AlphaPulse: GCP-Native ADKv2 Realtime Quantitative Trading & Agentic Settlement System (MCP, A2A, A2UI, AP2, OAuth 2.1, Agent Identity)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
  { name = "Navakanth Talluri", email = "navakantht-nav@users.noreply.github.com" }
]
keywords = [
  "google-adk",
  "adkv2",
  "mcp",
  "a2a",
  "a2ui",
  "ap2",
  "agent-runtime",
  "agent-identity",
  "opentelemetry",
  "quantitative-trading",
]
dependencies = [
  "google-adk[a2a,eval,otel]>=1.18.0",
  "google-genai>=1.40.0",
  "google-cloud-aiplatform[adk,agent_engines]>=1.95.0",
  "google-cloud-logging>=3.11.0",
  "google-cloud-trace>=1.14.0",
  "mcp>=1.6.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "cryptography>=43.0.0",
  "opentelemetry-api>=1.28.0",
  "opentelemetry-sdk>=1.28.0",
  "opentelemetry-exporter-gcp-trace>=1.8.0",
  "opentelemetry-exporter-otlp-proto-http>=1.28.0",
  "httpx>=0.27.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["trading_agent", "mcp_toolkit", "app"]

[tool.uv]
managed = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict_optional = true
