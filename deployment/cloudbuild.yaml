steps:
  - name: "gcr.io/cloud-builders/docker"
    id: "build-image"
    args:
      - "build"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/alphapulse:${SHORT_SHA}"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    id: "push-image"
    args:
      - "push"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/alphapulse:${SHORT_SHA}"

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy-cloud-run-gateway-and-mcp"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "${_SERVICE_NAME}"
      - "--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/alphapulse:${SHORT_SHA}"
      - "--region=${_REGION}"
      - "--platform=managed"
      - "--no-allow-unauthenticated"
      - "--set-env-vars=GOOGLE_GENAI_USE_VERTEXAI=TRUE,GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_CLOUD_LOCATION=global,ALPHAPULSE_INFRA_REGION=${_REGION},ALPHAPULSE_ENABLE_CLOUD_TRACE=TRUE"

substitutions:
  _REGION: "us-central1"
  _AR_REPO: "alphapulse-containers"
  _SERVICE_NAME: "alphapulse-trading-system"

options:
  logging: CLOUD_LOGGING_ONLY
